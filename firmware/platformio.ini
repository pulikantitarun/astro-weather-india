[platformio]
src_dir = AstroWeather_ESP32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit MLX90614 Library
  adafruit/Adafruit TSL2591 Library
  witnessmenow/UniversalTelegramBot @ ^1.3.0
  bblanchon/ArduinoJson @ ^6.21.5
