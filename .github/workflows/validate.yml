name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install trimesh networkx
      - run: python tools/validate_stls.py --check
      - run: python tools/calculate_sqm_offset.py --self-test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: cp firmware/AstroWeather_ESP32/secrets.example.h firmware/AstroWeather_ESP32/secrets.h
      - run: pio run --project-dir firmware

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/test_integration_contracts.py
      - run: python tools/test_configuration_contract.py
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential cmake libindi-dev libcurl4-openssl-dev nlohmann-json3-dev
      - run: cmake -S integrations/indi-astroweather -B build/indi -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/indi --parallel
