name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install trimesh networkx
      - run: python tools/validate_stls.py --check

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: cp firmware/AstroWeather_ESP32/secrets.example.h firmware/AstroWeather_ESP32/secrets.h
      - run: pio run --project-dir firmware
